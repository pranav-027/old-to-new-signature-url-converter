<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>URL Converter</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: beige;
      font-family: 'Inter', sans-serif;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin: 30px 0;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      height: 120px;
      margin-bottom: 10px;
      font-size: 14px;
      padding: 10px;
      box-sizing: border-box;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
      font-size: 20px;
    }

    button {
      padding: 10px 18px;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      background-color: #4a6cf7;
      color: white;
      font-weight: 600;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background-color: #3a5be0;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

  <h1> Angular URL --> Legacy URL converter</h1>

  <label for="inputUrl">Input URL</label>
  <textarea id="inputUrl" placeholder="Paste input URL here..."></textarea>

  <label for="outputUrl">Output URL</label>
  <textarea id="outputUrl" readonly placeholder="Converted URL will appear here..."></textarea>

  <button id="copyBtn">Copy to Clipboard</button>
  <button id="openUrlBtn">Open URL</button>

  <script>
    const input = document.getElementById("inputUrl");
    const output = document.getElementById("outputUrl");
    const copyBtn = document.getElementById("copyBtn");
    const openUrlBtn = document.getElementById("openUrlBtn");

    input.addEventListener("input", () => {
      let value = input.value;

      if (!value) {
        output.value = "";
        return;
      }

      value = value.replace(
        "http://localhost:8091/signature-front-ws/signature/",
        "http://localhost:8088/signature-front-web/"
      );

      output.value = value;
    });

    copyBtn.addEventListener("click", async () => {
      if (!output.value) return;

      try {
        await navigator.clipboard.writeText(output.value);
        copyBtn.textContent = "Copied!";
        setTimeout(() => copyBtn.textContent = "Copy to Clipboard", 1500);
      } catch (err) {
        alert("Copy failed. Please copy manually.");
      }
    });

    openUrlBtn.addEventListener("click", () => {
      if (!output.value) return;

      window.open(output.value, "_blank");
    });
  </script>

</body>

</html>
